name: Build MT6768 Linux 5.10 kernel for ZPD1203 (k69v1_64_k510)

on:
  workflow_dispatch:
    inputs:
      build_modules:
        description: "Also build modules (*.ko)"
        type: boolean
        default: true

env:
  ARCH: arm64
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_xelex_mt6789.git
  KERNEL_BRANCH: lineage-23.2
  KERNEL_DEFCONFIG: k69v1_64_k510_defconfig
  CLANG_REPO: https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b.git
  CLANG_BRANCH: "11.0"

jobs:
  build:
    # 5.10 MTK tree: use 22.04 (glibc older, prebuilt clang r416183b expects it)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout builder repo
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libelf-dev git python3 \
          libncurses-dev rsync kmod cpio wget xz-utils lz4 zstd \
          gcc-aarch64-linux-gnu
        sudo ln -sf /usr/bin/python3 /usr/bin/python
        echo "--- host gcc ---"; gcc --version | head -1
        echo "--- cross gcc ---"; aarch64-linux-gnu-gcc --version | head -1

    - name: Fetch AOSP prebuilt clang r416183b (Android 12 / 5.10 era)
      run: |
        set -e
        cd $HOME
        echo "[+] cloning clang prebuilt (this is ~350MB)"
        git clone --depth=1 -b "${{ env.CLANG_BRANCH }}" "${{ env.CLANG_REPO }}" clang-prebuilt
        ls -l clang-prebuilt/bin/clang
        $HOME/clang-prebuilt/bin/clang --version | head -3
        echo "[ok] clang ready"

    - name: Clone kernel source 5.10
      run: |
        set -e
        git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_REPO }}" kernel-source
        cd kernel-source
        echo "--- version ---"
        grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile
        echo "--- defconfig ---"
        ls -l arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }}
        echo "--- k69 dts ---"
        ls -l arch/arm64/boot/dts/mediatek/k69v1_64_k510.dts

    - name: Apply minimal build fixes
      run: |
        set -e
        cd kernel-source

        # Fix 1: MTK pinctrl debug uses <../../gpio/gpiolib.h> which clang rejects
        # ("file not found with <angled> include; use quotes instead").
        FILE=drivers/pinctrl/mediatek/pinctrl-mtk-common-v2_debug.c
        if grep -q '#include <\.\./\.\./gpio/gpiolib\.h>' "$FILE"; then
          sed -i 's|#include <\.\./\.\./gpio/gpiolib\.h>|#include "../../gpio/gpiolib.h"|' "$FILE"
          echo "[+] fix1: angled include in $FILE"
        fi

        # Fix 2: rpmb-mtk.c declares "struct mmc_host *mmc = mtk_mmc_host[0];"
        # unconditionally inside rpmb_gp_listenDci(), but mtk_mmc_host[] only
        # exists under CONFIG_MMC_MTK_PRO. Both configs are =m (different
        # modules), so the symbol is unavailable -> "use of undeclared
        # identifier 'mtk_mmc_host'". Guard the declaration to match its use.
        R=drivers/char/rpmb/rpmb-mtk.c
        python3 - "$R" <<'PYEOF'
        import sys
        p = sys.argv[1]
        src = open(p, encoding='utf-8', errors='replace').read()
        old = "\tu32 cmdId;\n\tstruct mmc_host *mmc = mtk_mmc_host[0];\n"
        new = ("\tu32 cmdId;\n"
               "#if IS_ENABLED(CONFIG_MMC_MTK_PRO)\n"
               "\tstruct mmc_host *mmc = mtk_mmc_host[0];\n"
               "#endif\n")
        if old in src:
            src = src.replace(old, new, 1)
            open(p, 'w', encoding='utf-8').write(src)
            print("[+] fix2: guarded mtk_mmc_host declaration in rpmb-mtk.c")
        else:
            print("[!] fix2: pattern not found (already patched?)")
        PYEOF

        echo "--- verify fix2 ---"
        sed -n '2334,2345p' "$R"

    - name: Configure kernel (vanilla baseline)
      run: |
        set -e
        cd kernel-source
        export PATH="$HOME/clang-prebuilt/bin:$PATH"
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
          ${{ env.KERNEL_DEFCONFIG }}
        echo "--- key config ---"
        grep -E 'CONFIG_MTK_PLAT_POWER_MT6768|CONFIG_KPROBES|CONFIG_MODULES|CONFIG_LOCALVERSION' .config || true
        echo "--- ratio: =y $(grep -c '=y$' .config) / =m $(grep -c '=m$' .config) ---"

    - name: Build kernel Image (baseline, no patches)
      run: |
        cd kernel-source
        set -o pipefail
        export PATH="$HOME/clang-prebuilt/bin:$PATH"
        clang --version | head -2
        make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          Image 2>&1 | tee build-image.log
        echo "=== done ==="
        ls -lh arch/arm64/boot/Image

    - name: Build modules
      if: ${{ inputs.build_modules }}
      run: |
        cd kernel-source
        set -o pipefail
        export PATH="$HOME/clang-prebuilt/bin:$PATH"
        make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          modules 2>&1 | tail -60
        echo "--- ko count ---"
        find . -name '*.ko' -newermt '-2 hours' | wc -l

    - name: Collect build log tail
      if: always()
      run: |
        echo "=== build-image.log tail (120) ==="
        tail -120 kernel-source/build-image.log 2>/dev/null || echo "(no log)"
        echo ""
        echo "=== unique error lines ==="
        grep -oE '(error:|Error [0-9])[^|]*' kernel-source/build-image.log 2>/dev/null \
          | sed 's/\x1b\[[0-9;]*m//g' | sort -u | head -40 || true

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-510-baseline
        path: |
          kernel-source/arch/arm64/boot/Image
          kernel-source/build-image.log
        retention-days: 7
        if-no-files-found: warn
