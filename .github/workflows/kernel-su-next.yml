name: Build KernelSU Next boot image for ZPD1203 (MT6768)

on:
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CC: aarch64-linux-gnu-gcc
  KERNEL_SOURCE: https://github.com/WUNELEZI1/Gale-Kernel-Source.git
  KERNEL_BRANCH: mt6768-4.19
  KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
  KSU_BRANCH: dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout builder repo (scripts + your boot_a.img)
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libelf-dev \
          gcc-9-aarch64-linux-gnu g++-9-aarch64-linux-gnu git python3 \
          libncurses-dev dwarves rsync kmod cpio wget xz-utils
        sudo ln -sf /usr/bin/python3 /usr/bin/python
        # Use GCC 9 toolchain (compatible with 4.19 kernel)
        sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/bin/aarch64-linux-gnu-gcc
        sudo ln -sf /usr/bin/aarch64-linux-gnu-g++-9 /usr/bin/aarch64-linux-gnu-g++
        aarch64-linux-gnu-gcc --version | head -1

    - name: Require boot_a.img in repo
      run: |
        test -f boot_a.img || { echo "error: put your boot_a.img at repo root"; exit 1; }
        ls -l boot_a.img

    - name: Clone kernel source
      run: |
        git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SOURCE }} kernel-source
        cd kernel-source
        git log --oneline -3

    - name: Integrate KernelSU Next
      run: |
        cd kernel-source
        git clone --depth=1 -b ${{ env.KSU_BRANCH }} ${{ env.KSU_REPO }} kernelsu-next
        ln -sfn ../kernelsu-next/kernel drivers/kernelsu
        printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
        echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

    - name: Configure kernel
      run: |
        cd kernel-source
        rm -f .config
        make k69v1_64_k419_defconfig
        {
          echo "# KernelSU Next integration (added by build)"
          echo "CONFIG_MODULES=y"
          echo "CONFIG_MODVERSIONS=n"
          echo "CONFIG_MODULE_UNLOAD=y"
          echo "CONFIG_EXT4_FS=y"
          echo "CONFIG_KPROBES=y"
          echo "CONFIG_KSU=y"
          echo "CONFIG_KSU_DEBUG=n"
          echo "# Disable problematic features for 4.19 compat"
          echo "CONFIG_UCLAMP_TASK=n"
          echo "CONFIG_BLK_INLINE_ENCRYPTION=n"
          echo "CONFIG_SND_SOC_RICHTEK_SPM_CLS=n"
        } >> .config
        make olddefconfig
        echo "--- key configs ---"
        grep -E 'CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_EXT4_FS|CONFIG_KPROBES|CONFIG_KSU' .config || true

    - name: Set kernel version to 4.19.191-ksu
      run: |
        cd kernel-source
        sed -i 's/^VERSION = .*/VERSION = 4/' Makefile
        sed -i 's/^PATCHLEVEL = .*/PATCHLEVEL = 19/' Makefile
        sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 191/' Makefile
        sed -i 's/^EXTRAVERSION = .*/EXTRAVERSION = -ksu/' Makefile
        grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile

    - name: Fix trace_mmstat build issue
      run: |
        cd kernel-source
        TS_FILE=$(find . -name "trace_mmstat.h" 2>/dev/null | head -1)
        TS_C=$(find . -name "trace_mmstat.c" 2>/dev/null | head -1)
        if [ -n "$TS_FILE" ]; then
          rm -f "$TS_FILE" "$TS_C"
          # Also remove from Makefile
          TS_DIR=$(dirname "$TS_C")
          if [ -f "$TS_DIR/Makefile" ]; then
            sed -i '/trace_mmstat/d' "$TS_DIR/Makefile"
            echo "[+] Removed trace_mmstat from $TS_DIR/Makefile"
          fi
          echo "[+] Removed $TS_FILE and $TS_C"
        fi

    - name: Fix always_inline errors
      run: |
        cd kernel-source
        # Fix uclamp_se_set inlining failure (broad replace)
        if grep -q 'always_inline' kernel/sched/sched.h; then
          sed -i 's/always_inline/inline/g' kernel/sched/sched.h
          echo "[+] Patched sched.h always_inline -> inline"
        fi
        # Fix ksm_flock inlining failure (broad replace, handle both variants)
        if grep -qE 'always_inline|__always_inline' include/linux/keyslot-manager.h; then
          sed -i 's/__always_inline/inline/g; s/always_inline/inline/g' include/linux/keyslot-manager.h
          echo "[+] Patched keyslot-manager.h always_inline -> inline"
        fi
        # Also handle __always_inline in sched.h
        sed -i 's/__always_inline/inline/g' kernel/sched/sched.h
        echo "[+] Patched sched.h __always_inline -> inline (if present)"

    - name: Disable problematic DVFSRC drivers
      run: |
        cd kernel-source
        {
          echo "CONFIG_MTK_DVFSRC=n"
          echo "CONFIG_MTK_DVFSRC_MT6768=n"
          echo "CONFIG_MTK_DVFSRC_HELPER=n"
        } >> .config
        yes "" | make oldconfig >/dev/null 2>&1 || true
        # Fallback: if dvfsrc directory still causes errors, disable source files
        DVFSRC_DIR="drivers/misc/mediatek/dvfsrc"
        if [ -d "$DVFSRC_DIR" ]; then
          find "$DVFSRC_DIR" -name "*.c" -exec sh -c 'echo "/* disabled */" > "$1"' _ {} \;
          echo "[+] DVFSRC source files disabled as fallback"
        fi
        # Also disable all helio-dvfsrc variants (missing headers)
        find drivers/devfreq -name '*dvfsrc*' -name '*.c' -exec sh -c 'echo "/* disabled */" > "$1"' _ {} \;
        echo "[+] all dvfsrc source files disabled"
        # Also disable all dvfsrc directories
        find drivers -path '*dvfsrc*' -name '*.c' -exec sh -c 'echo "/* disabled */" > "$1"' _ {} \;
        echo "[+] all dvfsrc source files (all dirs) disabled"
        # Disable richtek spm cls codec (format error)
        find . -name 'richtek_spm_cls.c' -exec sh -c 'echo "/* disabled */" > "$1"' _ {} \;

    - name: Fix KernelSU-Next 4.19 compat
      run: |
        cd kernel-source
        # Fix strncpy_from_user_nofault -> strncpy_from_user
        if grep -q 'strncpy_from_user_nofault' drivers/kernelsu/feature/sucompat.c; then
          sed -i 's/strncpy_from_user_nofault/strncpy_from_user/g' drivers/kernelsu/feature/sucompat.c
          echo "[+] Patched sucompat.c strncpy_from_user_nofault -> strncpy_from_user"
        fi
        # Fix copy_to_kernel_nofault -> probe_kernel_write
        if grep -rq 'copy_to_kernel_nofault' drivers/kernelsu/; then
          sed -i 's/copy_to_kernel_nofault/probe_kernel_write/g' $(grep -rl 'copy_to_kernel_nofault' drivers/kernelsu/)
          echo "[+] Patched copy_to_kernel_nofault -> probe_kernel_write"
        fi

    - name: Create missing header shims
      run: |
        cd kernel-source
        # mtk_gpufreq.h shim
        MTK_THERMAL_DIR="drivers/misc/mediatek/thermal/mt6768/inc/mach"
        if [ -d "$MTK_THERMAL_DIR" ]; then
          echo "/* shim */" > "$MTK_THERMAL_DIR/mtk_gpufreq.h"
          echo "[+] created mtk_gpufreq.h shim"
        fi
        # met_ftrace_touch.h shim
        echo "/* shim */" > include/trace/met_ftrace_touch.h 2>/dev/null || true
        echo "[+] created met_ftrace_touch.h shim"
        # linux/pgtable.h shim for KernelSU-Next (4.19 compat)
        mkdir -p include/linux
        printf '%s\n' '#ifndef _LINUX_PGTABLE_H' '#define _LINUX_PGTABLE_H' '#include <asm/pgtable.h>' '#endif' > include/linux/pgtable.h
        echo "[+] created linux/pgtable.h shim"

    - name: Build kernel Image.gz
      run: |
        cd kernel-source
        make -j$(nproc) KCFLAGS="-Wno-error -Wno-format" CFLAGS="-Wno-error -Wno-format" Image.gz || make -j$(nproc) KCFLAGS="-Wno-error -Wno-format" CFLAGS="-Wno-error -Wno-format" Image
        ls -lh arch/arm64/boot/Image* 2>/dev/null || true

    - name: Repack boot image (kernel swap, keep ramdisk/dtb/cmdline)
      id: repack
      run: |
        cd kernel-source
        KIMG=arch/arm64/boot/Image.gz
        [ -f "$KIMG" ] || KIMG=arch/arm64/boot/Image
        bash ../scripts/repack_boot.sh \
          --extract ../boot_a.img \
          --kernel "$KIMG" \
          --out boot_a_ksu.img
        ls -l boot_a_ksu.img

    - name: Build AnyKernel3 flashable zip
      run: |
        rm -rf ak3 && mkdir -p ak3/kernel ak3/META-INF/com/google/android
        cp kernel-source/boot_a_ksu.img ak3/kernel/boot.img
        cp anykernel3/anykernel.sh ak3/anykernel.sh
        cp anykernel3/META-INF/com/google/android/updater-script ak3/META-INF/com/google/android/updater-script
        cd ak3
        zip -r9 ../anykernel3-zpd1203-ksu.zip . -x '.*' __MACOSX
        cd ..
        ls -l anykernel3-zpd1203-ksu.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: boot-img-ksu
        path: |
          kernel-source/boot_a_ksu.img
          anykernel3-zpd1203-ksu.zip
        retention-days: 7
